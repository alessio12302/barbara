<!DOCTYPE html>
<html lang="it">
<head>
    <meta
	
	
		
	
	
		
	
 charset="UTF-8">
    <meta
	
	
		
	
	
	
 name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Domotico</title>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }

        /* Stile per il video di sfondo */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1; /* Mette il video dietro tutto il resto */
            object-fit: cover;
        }

        .container { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn { display: block; width: 280px; margin: 15px auto; padding: 15px; font-size
	
	
		
	
	
	
: 16px; cursor: pointer; border: none; border-radius: 8px; color: white; transition: 0.2s; }
        .btn-portone { background-color: #007bff; }
        .btn-app { background-color: #28a745; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="Sfondo.mp4" type="video/mp4">
        Il tuo browser non supporta i video HTML5.
    </video>

    <div class="container">
        <h1>Benvenuti</h1>
        <button class="btn btn-portone" onclick="inviaComando('URL_IFTTT_PORTONE')">Accedi al portone</button>
        <button class="btn btn-app" onclick="inviaComando('URL_IFTTT_TEDEE')">Accedi all'appartamento</button>
    </div>

    <script>
        function inviaComando(url) {
            fetch(url, { mode: 'no-cors' })
                .then(() => alert("Comando inviato!"))
                .catch(err => alert("Errore nell'invio."));
        }
    </script>

</body>
</html>
