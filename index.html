<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Domotico</title>
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%); 
            object-fit: cover;
        }

        .container { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 400px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 { color: #333; margin-bottom: 25px; }

        .btn { 
            display: block; 
            width: 100%; 
            margin: 15px 0; 
            padding: 18px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 12px; 
            color: white; 
            transition: transform 0.2s, opacity 0.2s; 
        }

        .btn-portone { background-color: #007bff; }
        .btn-app { background-color: #28a745; }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Sfondo.mp4" type="video/mp4">
        Il tuo browser non supporta la riproduzione video.
    </video>

    <div class="container">
        <h1>Benvenuti</h1>
        <button class="btn btn-portone" onclick="apriPortone()">Accedi al portone</button>
        <button class="btn btn-app" onclick="apriAppartamento()">Accedi all'appartamento</button>
    </div>

    <script>
        // Funzione per IFTTT
        function apriPortone() {
            const url = "https://maker.ifttt.com/trigger/Portone_Affitti/with/key/gnYYkYK-CXpD4U-5ROjNSCKbsiN5HJ8k8dVPoQklN4U";
            fetch(url, { mode: 'no-cors' })
                .then(() => alert("Prego, portone aperto!"))
                .catch(() => alert("Errore invio comando portone."));
        }

        // Funzione per GitHub Actions (Tedee)
        function apriAppartamento() {
            const GITHUB_TOKEN = "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";
            const REPO = "alessio12302/barbara"; // Es: mario/casa-domotica
            
            fetch(`https://api.github.com/repos/${REPO}/dispatches`, {
                method: 'POST',
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ "event_type": "trigger-apri" })
                "client_payload": { "unit": false, "integration": true }
            })
            .then(response => {
                if (response.ok) {
                    alert("Prego, appartamento sbloccato!");
                } else {
                    alert("Errore: verifica il token o la repository.");
                }
            })
            .catch(err => console.error("Errore:", err));
        }
    </script>
</body>
</html>
