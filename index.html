<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Appartamento</title>
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%); 
            object-fit: contain;
        }

        .container { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 400px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 { color: #333; margin-bottom: 25px; }

        .btn { 
            display: block; 
            width: 100%; 
            margin: 15px 0; 
            padding: 18px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 12px; 
            color: white; 
            transition: transform 0.2s, opacity 0.2s; 
        }

        .btn-portone { background-color: #007bff; }
        .btn-app { background-color: #28a745; }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Sfondo.mp4" type="video/mp4">
        Il tuo browser non supporta la riproduzione video.
    </video>

    <div class="container">
        <h1>Benvenuti a Roseto(TE)</h1>
        <button class="btn btn-portone" onclick="apriPortone()">Accedi al portone</button>
        <!-- Inserisci il tuo link web Tedee qui sotto -->
        <button class="btn btn-app" onclick="window.open('https://access.tedee.com/mi1WtXCvaki2SL6ZRWN7zxXybGXLw1Dr5EY1mGnAibwHveEHDkaeboEZzVapzjG.5f3x4BAX1AVtDibFgwB-Xg__', '_blank')">Accedi all'appartamento</button>
    </div>

    <script>
        // Funzione per IFTTT (Portone)
        function apriPortone() {
            const url = "https://maker.ifttt.com/trigger/Portone_Affitti/with/key/gnYYkYK-CXpD4U-5ROjNSCKbsiN5HJ8k8dVPoQklN4U";
            fetch(url, { mode: 'no-cors' })
                .then(() => alert("Portone Aperto"))
                .catch(() => alert("Errore di connessione."));
        }
    </script>
</body>
</html>
