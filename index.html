<script>
    // 1. Funzione per IFTTT
    function apriPortone() {
        const iftttUrl = "https://maker.ifttt.com/trigger/NOME_EVENTO/with/key/TUA_CHIAVE";
        fetch(iftttUrl, { mode: 'no-cors' })
            .then(() => alert("Segnale inviato: Il portone si sta aprendo."))
            .catch(err => console.error("Errore:", err));
    }

    // 2. Funzione per API Tedee Go
    function apriAppartamento() {
        const tedeeUrl = "https://api.tedee.com/v1.0/my/lock/unlock"; // Esempio endpoint
        const token = "TUO_TOKEN_API";
        
        fetch(tedeeUrl, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ "deviceId": "ID_DEL_TUO_TEDEE" })
        })
        .then(response => alert("Comando inviato al Tedee Go"))
        .catch(err => console.error("Errore:", err));
    }
