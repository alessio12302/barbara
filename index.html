<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Appartamento</title>
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%); 
            object-fit: contain;
            background-color: #000;
        }

        .container { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.25);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 { color: white; margin-bottom: 25px; font-weight: 800; }

        .btn { 
            display: block; 
            width: 100%; 
            margin: 15px 0; 
            padding: 18px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 12px; 
            color: white; 
            transition: transform 0.2s, opacity 0.2s;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .btn:hover {
            animation: none;
            transform: scale(1.05);
        }

        .btn-portone { background-color: #007bff; }
        .btn-app { background-color: #28a745; }
        .btn-eventi { background-color: #6f42c1; }
        .btn-citta { background-color: #444; margin: 8px 0; }
        .btn:active { transform: scale(0.95); opacity: 0.9; }

        #lista-citta {
            margin-top: 15px;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Sfondo.mp4" type="video/mp4">
        Il tuo browser non supporta la riproduzione video.
    </video>

    <div class="container">
        <h1>Benvenuti a Roseto(TE)</h1>
        
        <button class="btn btn-portone" onclick="apriPortone()">Accedi al portone</button>
        
        <button class="btn btn-app" onclick="window.open('https://access.tedee.com/mi1WtXCvaki2SL6ZRWN7zxXybGXLw1Dr5EY1mGnAibwHveEHDkaeboEZzVapzjG.5f3x4BAX1AVtDibFgwB-Xg__', '_blank')">Accedi all'appartamento</button>
        
        <button class="btn btn-eventi" onclick="mostraCitta()">Eventi</button>

        <div id="lista-citta">
            <button class="btn btn-citta" onclick="apriCalendario('roseto.pdf')">Roseto degli Abruzzi</button>
            <button class="btn btn-citta" onclick="apriCalendario('giulianova.pdf')">Giulianova</button>
            <button class="btn btn-citta" onclick="apriCalendario('pineto.pdf')">Pineto</button>
            <button class="btn btn-citta" onclick="apriCalendario('tortoreto.pdf')">Tortoreto</button>
            <button class="btn btn-citta" onclick="apriCalendario('alba_adriatica.pdf')">Alba Adriatica</button>
            <button class="btn btn-citta" onclick="apriCalendario('silvi.pdf')">Silvi</button>
            <button class="btn btn-citta" onclick="apriCalendario('atri.pdf')">Atri</button>
        </div>
    </div>

    <script>
        function apriPortone() {
            const url = "https://maker.ifttt.com/trigger/Portone_Affitti/with/key/gnYYkYK-CXpD4U-5ROjNSCKbsiN5HJ8k8dVPoQklN4U";
            fetch(url, { mode: 'no-cors' })
                .then(() => alert("Portone Aperto"))
                .catch(() => alert("Errore di connessione."));
        }

        function mostraCitta() {
            const lista = document.getElementById('lista-citta');
            lista.style.display = (lista.style.display === 'none' || lista.style.display === '') ? 'block' : 'none';
        }

        function apriCalendario(file) {
            // Tenta l'apertura in una nuova scheda
            var win = window.open(file, '_blank');
            // Se il browser blocca l'apertura (comune su mobile), forza il reindirizzamento
            if (!win) {
                window.location.href = file;
            }
            document.getElementById('lista-citta').style.display = 'none';
        }
    </script>
</body>
</html>
